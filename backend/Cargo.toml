[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_with = "3.16.1"
time = { version = "0.3.44", features = ["serde", "serde-human-readable"] }
sqlx = { version = "0.8.6", features = ["time", "postgres", "sqlx-postgres", "tls-rustls", "runtime-tokio"] }
tracing = "0.1.41"
env_logger = "0.11.8"
argon2 = { version = "0.6.0-rc.2", features = ["getrandom"] }
async-trait = "0.1.89"
jsonwebtoken = { version = "10.0.0", features = ["rust_crypto"] }
actix-jwt-auth-middleware = "0.5.0"
dotenvy = "0.15.7"
tracing-actix-web = "0.7.19"

[dev-dependencies]
fake = { version = "4.4.0", features = ["derive"] }

[[bin]]
name = "authserver"
path = "src/main.rs"